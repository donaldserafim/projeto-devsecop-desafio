name: 🔐 Pipeline DevSecOps

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 — Build, segurança e assinatura do artefato
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build, Segurança e Assinatura
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Usado o enviroments do github para armazenar as chaves e
      # Usado o sed para trocar pelos valores do enviroment
      # feito a validação para verificar se há substituição e necessitou
      # adicionar a palavra enviroment para poder achar o cofre.
      - name: 🔐 Inserir Secrets no JavaScript
        env:
          APIKEY: ${{ secrets.APIKEY  }}
          DBPASSWORD: ${{ secrets.DBPASSWORD  }}
        run: |
          echo "Inserido Segredos no arquivo"
          sed -i "s|__DBPASSWORD__|$DBPASSWORD|g" src/script.js
          sed -i "s|__APIKEY__|$APIKEY|g" src/script.js

      - name: ⚙️ Build
        run: |
          echo "Verificando arquivos..."
          ls src/
          echo "Build OK!"

      # ❌ PASSO A IMPLEMENTAR — Secrets Scanning com Gitleaks
      # Dica: use a action oficial "gitleaks/gitleaks-action@v2"
      # foi implementado com a versão mais nova, que é a 3 e adicionado o arquivo de configuração
      # .gitleaks.toml para adicionar a variavel do banco de dados.
      - name: 🔑 Secrets Scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}


      ##instala ao Python para ser usado no SemGrep
      - name: 🐍 Configurar Python para o SAST
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      ##instala ao semgrep SAST
      - name: 🐍 Install SemGrep
        run: |
          python -m pip install semgrep


      # Analisa o código e interrompe a pipeline quando encontra vulnerabilidades.
      # semgrep scan: executa a análise estática do código (SAST).
      # --config auto: seleciona regras do Registry conforme as linguagens e frameworks do projeto.
      # --config p/xss: adiciona regras para detectar Cross-Site Scripting (XSS).
      # --error: retorna código de saída 1 quando encontra problemas, fazendo o step falhar.
      # src/: limita a análise aos arquivos do diretório src.
      - name: 🔍 SAST - Semgrep
        id: semgrep
        run: |
          semgrep scan --config auto --config p/xss --error --json --output semgrep.json src/


      # Saída em html para ficar mais claro os erros.
      - name: 📋 Resultado do Semgrep
        if: always()
        uses: ./.github/actions/semgrep-summary
        with:
          outcome: ${{ steps.semgrep.outcome }}


      # Gerando o package-lock
      - name: 🔍 Gerar o package-lock
        run: |
          echo "Gerando o package-lock"
          npm install --package-lock-only --no-audit --no-fund

      # Instalar o Grype
      - name: 🔍 Instalar o grype
        run: |
          echo "Instalando o Grype"
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      #rodar o Grype
      - name: Executar o grype
        id: grype
        run: |
          echo "Iniciando a execução do grype"
          grype dir:. --fail-on medium -o json > grype.json

      # Publica o resumo visual mesmo quando a análise bloqueia a pipeline.
      - name: 📋 Resultado do Grype
        if: always()
        uses: ./.github/actions/grype-summary
        with:
          outcome: ${{ steps.grype.outcome }}

      # ── Empacota o site em um artefato tar (formato que o Pages consome)
      - name: 📦 Empacotar artefato do site
        run: |
          tar \
            --dereference --hard-dereference \
            -C src \
            -cvf artifact.tar \
            --exclude=.git --exclude=.github \
            .

      # ── Calcula o hash do artefato
      - name: 🔢 Hash do artefato
        run: |
          digest=$(sha256sum artifact.tar | awk '{print $1}')
          echo "$digest" > artifact.tar.sha256
          echo "SHA256: $digest"

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # ❌ PASSO A IMPLEMENTAR — Assinatura via Cosign
      # Este passo NÃO assina de verdade — ele gera um bundle falso, só para
      # demonstração.
      #
      # Dica da assinatura real:
      #   cosign sign-blob artifact.tar --bundle artifact.sigstore.json --yes
      - name: ✍️ Assinar artefato
        run: |
          echo '{ "mock": "assinatura-invalida-para-demonstracao" }' > artifact.sigstore.json
          echo "Assinatura MOCK gerada."

      # ── Publica o artefato + bundle de assinatura para o próximo job
      - name: ⬆️ Upload do artefato assinado
        uses: actions/upload-artifact@v4
        with:
          name: site-assinado
          path: |
            artifact.tar
            artifact.sigstore.json
            artifact.tar.sha256
          retention-days: 1

  # ────────────────────────────────────────────────────────────────
  # JOB 2 — Verifica a assinatura e só então faz o deploy
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Verificação e Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Baixar o artefato assinado
        uses: actions/download-artifact@v4
        with:
          name: site-assinado

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # ⚠️ Usa o Cosign para validar assinatura do artefato - descomentar após assinatura
      # - name: 🔎 Verificar assinatura do artefato
      #  run: |
      #    cosign verify-blob artifact.tar \
      #      --bundle artifact.sigstore.json \
      #      --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*" \
      #      --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      #    echo "Assinatura válida — artefato íntegro e autêntico."

      # Descompacta o site para publicar
      - name: 📂 Extrair site verificado
        run: |
          mkdir -p site
          tar -xvf artifact.tar -C site

      - name: 🌐 Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload para Produção
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # Realiza o deploy
      - name: 🚀 Deploy em Produção
        id: deployment
        uses: actions/deploy-pages@v4
