name: 📊 Telemetria da Pipeline

on:
  workflow_run:
    workflows: ["🔐 Pipeline DevSecOps"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  export:
    name: Exportar traces OpenTelemetry
    if: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Não faz checkout nem executa código ou artefatos da execução monitorada.
      - name: Exportar execução concluída
        id: otel
        uses: dash0hq/otel-cicd-action@4826b79d63662fa91657272e7711420cb6aea543 # v4.2.0
        with:
          # Alterar em Settings → Secrets and variables → Actions → Variables.
          # Trocar o endereço não exige editar este workflow nem criar commit.
          otlpEndpoint: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          otlpHeaders: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          runId: ${{ github.event.workflow_run.id }}
          otelServiceName: projeto-devsecop-desafio-ci
